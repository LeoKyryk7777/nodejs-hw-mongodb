type: object
properties:
  name:
    type: string
    example: 'John Doe'
  phoneNumber:
    type: string
    example: '+380942845375'
  email:
    type: string
    example: 'vasyl9@example.com'
  contactType:
    type: string
    enum: ['work', 'home', 'personal']
  isFavourite:
    type: boolean
    example: true
  photo:
    type: string
    format: binary
