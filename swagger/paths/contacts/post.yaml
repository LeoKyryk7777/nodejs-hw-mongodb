tags:
  - Contacts
summary: Create contacts
operationId: createContacts
description: 'Create a contact with payload'
security:
  - bearerAuth: []

requestBody:
  content:
    multipart/form-data:
      schema:
        $ref: '../../components/schemas/contactRequest.yaml'

responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: '../../components/schemas/contactResponse.yaml'
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid input data
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
